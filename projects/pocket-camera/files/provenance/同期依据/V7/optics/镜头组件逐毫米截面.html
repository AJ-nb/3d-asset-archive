function path(d,n){const a=document.createElementNS('http://www.w3.org/2000/svg','path');a.setAttribute('d',d);a.setAttribute('stroke',color(n));a.setAttribute('stroke-width','.074');a.setAttribute('fill','none');a.setAttribute('stroke-linejoin','round');return a}
function show(){const z=+slider.value;el('read').textContent='Z = '+z+' mm';const zoom=el('zoom').checked;el('view').setAttribute('viewBox',zoom?'-12 -32 24 24':'-21 -32 42 42');const target=el('paths');const list=el('list');target.replaceChildren();list.replaceChildren();const ids=new Set();for(const [id,d] of data.rows[z]){target.append(path(d,data.groups[id]));ids.add(id)}for(const id of ids){const li=document.createElement('li');li.textContent=label(data.groups[id]);li.style.setProperty('--tone',color(data.groups[id]));list.append(li)}const k=zoom?.48:.8;el('axis').innerHTML='<text x="'+(zoom?-11.8:-20.6)+'" y="-30.8" font-size="'+k+'">−Y  FRONT</text>';el('prev').disabled=z<=112;el('next').disabled=z>=159}
el('prev').onclick=()=>{slider.stepDown();show()};el('next').onclick=()=>{slider.stepUp();show()};slider.oninput=show;el('zoom').onchange=show;show();
</script></html>
